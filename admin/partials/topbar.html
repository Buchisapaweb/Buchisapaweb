      <!-- TOPBAR SUPERIOR (STICKY Y ELEGANTE) -->
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="menu-toggle-btn" id="btn-mobile-menu" title="Abrir menú lateral">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
          </button>
          <div class="topbar-title-block">
            <h2 id="topbar-title">Dashboard Principal</h2>
            <p id="topbar-desc">Métricas operativas, comensales y cocina en tiempo real</p>
          </div>
        </div>

        <div class="topbar-right">
          <!-- BUSCADOR RÁPIDO EN TOPBAR -->
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" class="admin-search-input" placeholder="Buscar en panel...">
          </div>

          <!-- BOTÓN REFRESCO -->
          <button class="btn btn-secondary btn-icon-only" onclick="location.reload()" title="Refrescar datos">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </button>

          <!-- BOTÓN NUEVO PRODUCTO / ACCIÓN RÁPIDA -->
          <button class="btn btn-primary btn-open-new-product">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
            <span class="btn-text-full">+ Nuevo Producto</span>
            <span class="btn-text-mobile">+ Nuevo</span>
          </button>
        </div>
      </header>
