<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuchiSapa Admin - Panel de Control</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link rel="stylesheet" href="/admin/css/productos.css">
</head>
<body class="bg-[#070a13] text-[#f1f5f9] overflow-hidden antialiased font-['Plus_Jakarta_Sans',system-ui,sans-serif] selection:bg-orange-500/25 selection:text-orange-300">

<div class="flex h-screen overflow-hidden">
    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden transition-opacity"></div>

    <!-- Sidebar Container -->
    <aside id="admin-sidebar" class="fixed inset-y-0 left-0 w-full lg:w-64 bg-[#0f1424] border-r border-slate-800/80 flex flex-col justify-between z-40 shrink-0 h-full transition-transform duration-200 -translate-x-full lg:translate-x-0 lg:static">
        <div>
            <!-- Brand Identity Header -->
            <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="/imagenes/logo/logo-buchisapa.webp" class="w-12 h-12 object-contain filter drop-shadow-[0_4px_12px_rgba(249,115,22,0.3)] select-none transition-transform hover:scale-105 duration-200" alt="BuchiSapa Logo" onerror="this.style.display='none'">
                    <div>
                        <h1 class="font-extrabold text-lg text-white leading-none tracking-tight select-none">BuchiSapa</h1>
                    </div>
                </div>
                <!-- Mobile Close Button -->
                <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-slate-800/50 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 active:scale-95 transition-all lg:hidden" aria-label="Cerrar panel lateral">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="p-4 space-y-1">
                <p class="px-3 text-[10px] font-black uppercase text-slate-500 tracking-wider mb-2 select-none">Administración</p>
                
                <a href="/admin?view=dashboard" id="nav-dashboard" class="nav-item-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all duration-150 text-slate-400 hover:bg-slate-800/50 hover:text-slate-100">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard</span>
                </a>

                <a href="/admin?view=clientes" id="nav-clientes" class="nav-item-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all duration-150 text-slate-400 hover:bg-slate-800/50 hover:text-slate-100">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>Cliente</span>
                </a>

                <a href="/admin?view=productos" id="nav-productos" class="nav-item-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all duration-150 text-slate-400 hover:bg-slate-800/50 hover:text-slate-100">
                    <i data-lucide="chef-hat" class="w-4 h-4"></i>
                    <span>Productos</span>
                </a>

                <a href="/admin?view=pedidos" id="nav-pedidos" class="nav-item-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all duration-150 text-slate-400 hover:bg-slate-800/50 hover:text-slate-100">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Pedidos</span>
                </a>

                <a href="/admin?view=ticket" id="nav-ticket" class="nav-item-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all duration-150 text-slate-400 hover:bg-slate-800/50 hover:text-slate-100">
                    <i data-lucide="ticket" class="w-4 h-4"></i>
                    <span>Ticket</span>
                </a>

                <a href="/admin?view=configuracion" id="nav-configuracion" class="nav-item-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all duration-150 text-slate-400 hover:bg-slate-800/50 hover:text-slate-100">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-slate-800/80 space-y-2 bg-[#0a0d1a]">
            <a href="/index.html" class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-red-500/10 border border-red-500/15 text-xs font-bold text-red-400 hover:bg-red-600 hover:text-white transition-all text-center active-press shadow-sm shadow-red-500/5">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <!-- Workspace Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar Header -->
        <header class="h-16 border-b border-slate-800/80 bg-[#0f1424]/90 backdrop-blur-md px-6 flex items-center justify-between shrink-0 z-30 sticky top-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="lg:hidden flex items-center justify-center w-10 h-10 -ml-2 rounded-xl text-slate-400 hover:text-orange-500 hover:bg-slate-800/50 active:scale-95 transition-all" aria-label="Abrir panel lateral">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider hidden sm:inline">BuchiSapa</span>
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider hidden sm:inline">/</span>
                    <span id="active-view-title" class="text-xs font-black text-white uppercase tracking-wider select-none">Dashboard</span>
                </div>
            </div>

            <div class="hidden md:flex items-center gap-4 text-xs font-bold text-slate-400">
                <span class="flex items-center gap-1.5 text-emerald-400">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span>Sistema Conectado</span>
                </span>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex items-center gap-3 pl-3 border-l border-slate-800/80">
                    <div class="text-right hidden sm:block">
                        <p class="text-xs font-black text-white leading-none">Administrador</p>
                        <p id="topbar-user-email" class="text-[10px] font-semibold text-slate-400 mt-0.5">admin@buchisapa.pe</p>
                    </div>
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 p-0.5 shadow-md shrink-0">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="w-full h-full object-cover rounded-[10px]">
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content View Container -->
        <main id="admin-main-content" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-[#0b0f19]">
            <!-- Dynamic view loaded via JS API -->
        </main>
    </div>
</div>

<!-- Modal Container -->
<div id="modal-container" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md items-center justify-center p-3 sm:p-4 overflow-y-auto"></div>

<!-- JS Core Scripts -->
<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('admin-sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (sidebar && overlay) {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view') || 'productos';

        document.querySelectorAll('.nav-item-btn').forEach(btn => {
            btn.classList.remove('bg-gradient-to-r', 'from-orange-600', 'to-orange-500', 'text-white', 'shadow-lg', 'shadow-orange-600/20');
            btn.classList.add('text-slate-400');
        });

        const activeBtn = document.getElementById('nav-' + view);
        if (activeBtn) {
            activeBtn.classList.remove('text-slate-400');
            activeBtn.classList.add('bg-gradient-to-r', 'from-orange-600', 'to-orange-500', 'text-white', 'shadow-lg', 'shadow-orange-600/20');
        }

        const titleMap = {
            'dashboard': 'Dashboard',
            'clientes': 'Clientes',
            'productos': 'Productos',
            'pedidos': 'Pedidos y Comandas',
            'ticket': 'Ticket',
            'configuracion': 'Configuración'
        };

        const titleEl = document.getElementById('active-view-title');
        if (titleEl) {
            titleEl.textContent = titleMap[view] || 'Productos';
        }

        if (view === 'productos' && typeof initProductosView === 'function') {
            initProductosView();
        }
    });
</script>

<script src="/admin/js/productos.js"></script>

</body>
</html>
