<!-- Topbar Header wrapper -->
<header class="h-16 border-b border-slate-800/80 bg-[#0f1424]/90 backdrop-blur-md px-6 flex items-center justify-between shrink-0 z-30 sticky top-0">
    <!-- Zone 1: Brand & Toggle (Left) -->
    <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="lg:hidden flex items-center justify-center w-10 h-10 -ml-2 rounded-xl text-slate-400 hover:text-orange-500 hover:bg-slate-800/50 active:scale-95 transition-all" aria-label="Abrir panel lateral">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        
        <div class="flex items-center gap-2 select-none">
            <span class="text-xs font-black text-white uppercase tracking-wider">BuchiSapa</span>
            <span class="text-xs font-bold text-orange-500 uppercase tracking-wider">Admin</span>
        </div>
    </div>

    <!-- Zone 2: Navigation Links or Indicators (Center) -->
    <div class="hidden md:flex items-center gap-4 text-xs font-bold text-slate-400">
        <span class="flex items-center gap-1.5 text-emerald-400">
            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
            <span>Sistema Conectado HTML5</span>
        </span>
    </div>

    <!-- Zone 3: Actions & Metrics (Right) -->
    <div class="flex items-center gap-3">
        <span id="topbar-clock" class="text-xs font-bold text-slate-400 font-mono bg-slate-800/40 px-3 py-1.5 rounded-xl border border-slate-800/60 hidden sm:inline select-none">
            00:00:00
        </span>
        
        <div class="flex items-center gap-3 select-none cursor-pointer">
            <div class="text-right">
                <span id="topbar-admin-name" class="text-xs font-extrabold text-white block leading-tight truncate max-w-[120px]">Administrador</span>
                <span class="text-[9px] text-orange-500 font-bold uppercase tracking-widest block leading-none mt-1">Admin Principal</span>
            </div>
            <img id="topbar-admin-img" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=120&auto=format&fit=crop" class="w-9 h-9 rounded-xl object-cover shadow-lg transition-transform duration-200 hover:scale-105" alt="Foto Administrador" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%232b1a0a%22/><text x=%2250%25%22 y=%2255%25%22 font-size=%2232%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22%23f97316%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>AD</text></svg>';">
        </div>
    </div>
</header>
<script>
    (function() {
        try {
            var savedPhoto = localStorage.getItem('admin_photo');
            var savedName = localStorage.getItem('admin_name');
            if (savedPhoto) {
                var img = document.getElementById('topbar-admin-img');
                if (img) img.src = savedPhoto;
            }
            if (savedName) {
                var nameEl = document.getElementById('topbar-admin-name');
                if (nameEl) nameEl.textContent = savedName;
            }
        } catch(e) {}
    })();
</script>
