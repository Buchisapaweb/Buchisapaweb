<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 select-none">
        <div>
            <h2 class="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
                <span class="w-2 h-4 bg-orange-500 rounded-sm"></span>
                Clientes Registrados (Perfiles)
            </h2>
            <p class="text-xs text-slate-400">Verifica cuentas, información de contacto, identificación (DNI/RUC) e historial de perfiles</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="px-2.5 py-1 bg-orange-500/10 border border-orange-500/15 text-orange-400 text-[10px] font-black uppercase rounded-lg" id="total-clientes-badge">
                Cargando...
            </span>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="cliente-search-wrapper relative animate-fade-in">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
            <i data-lucide="search" class="w-4 h-4"></i>
        </span>
        <input type="text" id="clientes-search" onkeyup="filterClientesTable()" placeholder="Buscar cliente por nombre, DNI, teléfono o email..." class="w-full bg-[#121829] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-orange-500/70 focus:ring-2 focus:ring-orange-500/10 transition-all">
    </div>

    <!-- Data Table Card (Desktop) -->
    <div class="hidden md:block bg-[#121829] rounded-2xl border border-slate-800/80 overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-[#0f1424]/60 border-b border-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-wider">
                        <th class="p-4">Identificación</th>
                        <th class="p-4">Nombre Completo</th>
                        <th class="p-4">Contacto</th>
                        <th class="p-4">Correo Electrónico</th>
                        <th class="p-4">Fecha de Registro</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 text-xs text-slate-300" id="clientes-tbody">
                    <!-- Renderizado dinámico por clientes.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Mobile Card List (Mobile) -->
    <div class="block md:hidden space-y-4" id="clientes-mobile-list">
        <!-- Renderizado dinámico por clientes.js -->
    </div>
</div>
