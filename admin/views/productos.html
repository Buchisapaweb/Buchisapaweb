<div class="space-y-6 animate-fade-in pb-12">
    <!-- Header Principal -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-3 border-b border-slate-800/60 select-none">
        <div>
            <div class="flex items-center gap-2.5">
                <span class="w-1.5 h-6 bg-gradient-to-b from-orange-500 to-amber-500 rounded-full shadow-[0_0_12px_rgba(249,115,22,0.5)]"></span>
                <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight">Platos</h2>
            </div>
            <p class="text-xs text-slate-400 mt-1">Gestión integral de la carta: categorías, acompañamientos, cremas, precios y stock en tiempo real</p>
        </div>
        
        <!-- Botones de Acción Centrados con Diseño Elegante -->
        <div class="flex items-center justify-center md:justify-end gap-3 w-full md:w-auto pt-1 sm:pt-0">
            <!-- Botón 1: Agregar Producto (Hero con microgradiente, sombra suave e icono estilizado) -->
            <button type="button" onclick="abrirCrearProductoModal()" class="group relative flex-1 sm:flex-initial inline-flex items-center justify-center gap-2.5 h-11 sm:h-12 px-5 sm:px-6 rounded-2xl bg-gradient-to-r from-orange-500 via-orange-600 to-amber-600 hover:from-orange-400 hover:via-orange-500 hover:to-amber-500 text-white font-extrabold text-xs sm:text-sm tracking-wide shadow-[0_4px_20px_-2px_rgba(249,115,22,0.4)] hover:shadow-[0_8px_28px_-2px_rgba(249,115,22,0.6)] border border-orange-400/35 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all duration-200 cursor-pointer overflow-hidden">
                <span class="absolute inset-0 bg-gradient-to-b from-white/15 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></span>
                <span class="w-6 h-6 rounded-lg bg-black/20 border border-white/20 flex items-center justify-center shrink-0 shadow-inner group-hover:scale-110 transition-transform">
                    <i data-lucide="plus" class="w-3.5 h-3.5 text-white stroke-[3]"></i>
                </span>
                <span class="whitespace-nowrap font-black">Agregar Producto</span>
            </button>

            <!-- Botón 2: Crear Categoría (Glassmorphism oscuro sofisticado con acentos dorados) -->
            <button type="button" onclick="abrirCrearCategoriaModal()" class="group relative flex-1 sm:flex-initial inline-flex items-center justify-center gap-2.5 h-11 sm:h-12 px-5 sm:px-6 rounded-2xl bg-[#111728]/95 hover:bg-[#161f36] text-slate-100 hover:text-white font-bold text-xs sm:text-sm tracking-wide shadow-[0_4px_16px_rgba(0,0,0,0.35)] hover:shadow-[0_8px_24px_rgba(249,115,22,0.18)] border border-slate-700/80 hover:border-orange-500/50 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all duration-200 cursor-pointer overflow-hidden">
                <span class="w-6 h-6 rounded-lg bg-orange-500/10 border border-orange-500/25 flex items-center justify-center shrink-0 text-orange-400 group-hover:scale-110 group-hover:bg-orange-500/20 transition-all">
                    <i data-lucide="folder-plus" class="w-3.5 h-3.5 text-orange-400 stroke-[2.4]"></i>
                </span>
                <span class="whitespace-nowrap font-bold">Crear Categoría</span>
            </button>
        </div>
    </div>

    <!-- Métricas Rápidas del Catálogo -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 select-none">
        <div class="p-3.5 bg-[#0f1424] rounded-xl border border-slate-800/80">
            <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider block">Total de Platos</span>
            <span class="text-lg font-black text-white font-mono block mt-0.5" id="stat-total-platos">Cargando...</span>
        </div>
        <div class="p-3.5 bg-[#0f1424] rounded-xl border border-slate-800/80">
            <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider block">Categorías</span>
            <span class="text-lg font-black text-orange-400 font-mono block mt-0.5" id="stat-categorias-platos">10 líneas</span>
        </div>
        <div class="p-3.5 bg-[#0f1424] rounded-xl border border-slate-800/80">
            <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider block">Disponibles</span>
            <span class="text-lg font-black text-emerald-400 font-mono block mt-0.5" id="stat-disponibles-platos">Activos</span>
        </div>
        <div class="p-3.5 bg-[#0f1424] rounded-xl border border-slate-800/80">
            <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider block">Stock Crítico (≤ 5)</span>
            <span class="text-lg font-black text-slate-400 font-mono block mt-0.5" id="stat-criticos-platos">0</span>
        </div>
    </div>

    <!-- Barra de Búsqueda y Filtros de Categorías -->
    <div class="space-y-3 select-none">
        <div class="relative max-w-lg">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                <i data-lucide="search" class="w-4 h-4"></i>
            </span>
            <input type="text" id="productos-search" oninput="filtrarPlatos()" placeholder="Buscar por nombre, acompañamiento, cremas o descripción..." class="w-full bg-[#121829] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
        </div>

        <!-- Pestañas Horizontales de Categorías -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1.5 scrollbar-none" id="categories-filter-bar">
            <button type="button" onclick="seleccionarFiltroCategoria('all')" class="category-tab-btn active px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 bg-orange-600 text-white" data-cat="all">
                Todos
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0001')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0001">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0001</span> PROMOCIONES
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0002')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0002">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0002</span> ALITAS
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0003')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0003">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0003</span> BEBIDAS
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0004')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0004">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0004</span> BROASTER
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0005')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0005">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0005</span> HAMBURGUESAS
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0006')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0006">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0006</span> INFUSIONES
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0007')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0007">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0007</span> PLATOS AMAZÓNICOS
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0008')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0008">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0008</span> REFRESCOS
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0009')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0009">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0009</span> SALCHIPAPAS Y SALCHIBROASTERS
            </button>
            <button type="button" onclick="seleccionarFiltroCategoria('C0010')" class="category-tab-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all shrink-0 text-slate-400 hover:text-white bg-[#0f1424] border border-slate-800" data-cat="C0010">
                <span class="font-mono text-[9px] text-orange-400 font-bold mr-1">C0010</span> ADICIONAL
            </button>
        </div>
    </div>

    <!-- SECCIONES DIVIDIDAS POR CATEGORÍAS -->
    <div class="space-y-10" id="productos-container">
        <!-- Renderizado dinámico instantáneo por productos.js -->
    </div>
</div>

<!-- Modal Container Frame -->
<div id="modal-container" class="fixed inset-0 bg-[#070a13] z-50 hidden transition-all duration-200 overflow-y-auto">
    <div id="modal-content" class="min-h-screen w-full bg-[#070a13] flex flex-col">
        <!-- Contenido dinámico a pantalla completa inyectado por productos.js -->
    </div>
</div>
