<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Pedido BuchiSapa | Carrito de Compras</title>
  <meta name="description" content="Revisa tu pedido, selecciona método de entrega y envíalo por WhatsApp o pasarela en BuchiSapa.">
  <link rel="icon" type="image/png" href="/imagenes/logo/logo-buchisapa.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/comun.css">
  <link rel="stylesheet" href="/css/informacion.css">
  <link rel="stylesheet" href="/css/cliente.css">
</head>
<body class="info-page-body">

  <header class="subpage-navbar">
    <div class="subpage-nav-wrap">
      <a href="/" class="subpage-brand" title="BuchiSapa - Inicio">
        <img src="/imagenes/logo/logo-buchisapa.webp" alt="BuchiSapa Logo" class="subpage-brand-logo">
        <span class="subpage-brand-title">BUCHISAPA</span>
      </a>
      <a href="/" class="clean-back-btn" title="Volver a la página principal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>Volver al Menú</span>
      </a>
    </div>
  </header>

  <main class="info-single-column cart-page-main">
    <article class="info-content-card cart-page-card">
      
      <!-- HEADER SIN CAJA INTERNA (SOLO CONTENEDOR EXTERNO GENERAL) -->
      <div class="cart-header-box-row">
        <div class="cart-header-left-group">
          <div class="cart-icon-container">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </div>
          <div class="cart-header-titles">
            <h1 class="info-article-title cart-main-title">Tu Pedido Buchisapa</h1>
            <span class="info-article-badge cart-main-badge">CARRITO DE COMPRAS EN LÍNEA</span>
          </div>
        </div>
        <button class="cart-subbar-empty-btn cart-empty-action-btn" id="btn-cart-empty" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
          <span>Vaciar Carrito</span>
        </button>
      </div>

      <!-- LAYOUT DE 2 COLUMNAS PARA ESCRITORIO DENTRO DE LA TARJETA PRINCIPAL -->
      <div class="cart-desktop-grid cart-desktop-grid-layout">
        <div id="cart-items-list-col" class="cart-main-column-wrap">
          <!-- Columna izquierda: Platos y recomendaciones -->
        </div>
        <div id="cart-summary-col" class="cart-sidebar-column-wrap">
          <!-- Columna derecha: Resumen del pedido y botón checkout -->
        </div>
      </div>

    </article>
  </main>

  <footer class="info-footer">
    <div class="container">
      © 2026 Restaurante BuchiSapa. Todos los derechos reservados.
    </div>
  </footer>

  <script src="/js/supabase-cliente.js"></script>
  <script src="/js/carrito.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
