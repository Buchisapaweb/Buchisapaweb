<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - BuchiSapa</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/webp" href="/imagenes/logo/logo-buchisapa.webp">
  <style>
    .admin-layout {
      min-height: 100vh;
      background: #f3f4f6;
    }
    .admin-header {
      background: #111827;
      color: #ffffff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-brand img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
    }
    .admin-title {
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: #f87171;
    }
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin: 32px 0 24px;
    }
    .stat-card {
      background: #ffffff;
      border-radius: var(--border-radius-md);
      padding: 20px 24px;
      border: 1px solid #e5e7eb;
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .stat-val {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }
    .orders-table-card {
      background: #ffffff;
      border-radius: var(--border-radius-md);
      border: 1px solid #e5e7eb;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
      margin-bottom: 40px;
    }
    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    .orders-table th {
      background: #f9fafb;
      padding: 14px 20px;
      color: #374151;
      font-weight: 700;
      border-bottom: 1px solid #e5e7eb;
    }
    .orders-table td {
      padding: 16px 20px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-recibido { background: #fee2e2; color: #b91c1c; }
    .status-preparando { background: #fef3c7; color: #b45309; }
    .status-en_camino { background: #dbeafe; color: #1d4ed8; }
    .status-entregado { background: #d1fae5; color: #047857; }
    .select-status {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body class="admin-layout">

  <header class="admin-header">
    <div class="admin-brand">
      <img src="/imagenes/logo/logo-buchisapa.webp" alt="BuchiSapa">
      <div>
        <span class="admin-title">BuchiSapa Admin</span>
        <small style="color: #9ca3af; display: block;">Santa Clara, Ate</small>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/" class="btn-outline" style="padding: 8px 16px; font-size: 13.5px; background: transparent; color: #ffffff; border-color: #4b5563;">
        🌐 Ir a la Web
      </a>
      <button id="admin-logout-btn" class="header-auth-btn" style="padding: 8px 16px;">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="container">
    <div class="admin-stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Pedidos</div>
        <div class="stat-val" id="stat-total-pedidos">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ventas Hoy</div>
        <div class="stat-val" style="color: #10b981;" id="stat-total-ventas">S/ 0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">En Cocina / Delivery</div>
        <div class="stat-val" style="color: #f59e0b;" id="stat-pedidos-activos">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Horario Local</div>
        <div class="stat-val" style="font-size: 20px; color: #111827;">6:00 PM - 5:00 AM</div>
      </div>
    </div>

    <div class="orders-table-card">
      <div class="table-header">
        <h3 style="font-size: 18px; font-weight: 700;">Pedidos Recientes de la Pollería</h3>
        <button id="btn-refresh-orders" class="btn-outline" style="padding: 6px 14px; font-size: 13px;">
          🔄 Actualizar
        </button>
      </div>

      <table class="orders-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente & Contacto</th>
            <th>Entrega / Dirección</th>
            <th>Items</th>
            <th>Total</th>
            <th>Pago</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ordersTbody = document.getElementById('orders-tbody');
      const statTotalPedidos = document.getElementById('stat-total-pedidos');
      const statTotalVentas = document.getElementById('stat-total-ventas');
      const statPedidosActivos = document.getElementById('stat-pedidos-activos');
      const btnRefresh = document.getElementById('btn-refresh-orders');
      const adminLogoutBtn = document.getElementById('admin-logout-btn');

      async function loadOrders() {
        try {
          const res = await fetch('/api/pedidos');
          const data = await res.json();
          if (data && data.pedidos) {
            renderOrders(data.pedidos);
          }
        } catch (err) {
          console.error('Error al cargar pedidos:', err);
        }
      }

      function renderOrders(pedidos) {
        if (!ordersTbody) return;

        // Stats
        statTotalPedidos.textContent = pedidos.length;
        const totalVentas = pedidos.reduce((sum, p) => sum + (p.total || 0), 0);
        statTotalVentas.textContent = `S/ ${totalVentas.toFixed(2)}`;
        const activos = pedidos.filter(p => p.estado !== 'entregado').length;
        statPedidosActivos.textContent = activos;

        if (pedidos.length === 0) {
          ordersTbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 30px; color: #6b7280;">No hay pedidos registrados aún.</td></tr>';
          return;
        }

        ordersTbody.innerHTML = pedidos.map(p => `
          <tr>
            <td><strong style="color: #e32229;">${p.id}</strong></td>
            <td>
              <strong>${p.cliente}</strong><br>
              <small style="color: #6b7280;">📞 ${p.telefono}</small>
            </td>
            <td>
              <span>${p.tipoEntrega === 'delivery' ? '🛵 Delivery' : '🏪 Salón/Recojo'}</span><br>
              <small style="color: #4b5563;">${p.direccion || 'Santa Clara'}</small>
            </td>
            <td>
              <small>${p.items.map(i => `${i.cantidad}x ${i.nombre}`).join('<br>')}</small>
            </td>
            <td><strong style="color: #111827;">S/ ${p.total.toFixed(2)}</strong></td>
            <td><span style="text-transform: uppercase; font-size: 12px; font-weight: 700;">${p.metodoPago}</span></td>
            <td>
              <span class="status-badge status-${p.estado}">${p.estado.replace('_', ' ')}</span>
            </td>
            <td>
              <select class="select-status" onchange="window.cambiarEstado('${p.id}', this.value)">
                <option value="recibido" ${p.estado === 'recibido' ? 'selected' : ''}>Recibido</option>
                <option value="preparando" ${p.estado === 'preparando' ? 'selected' : ''}>Preparando</option>
                <option value="en_camino" ${p.estado === 'en_camino' ? 'selected' : ''}>En camino</option>
                <option value="entregado" ${p.estado === 'entregado' ? 'selected' : ''}>Entregado</option>
              </select>
            </td>
          </tr>
        `).join('');
      }

      window.cambiarEstado = async function(id, nuevoEstado) {
        try {
          const res = await fetch(`/api/pedidos/${id}/estado`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ estado: nuevoEstado })
          });
          const data = await res.json();
          if (data.exito) {
            loadOrders();
          }
        } catch (e) {
          alert('Error al actualizar estado del pedido');
        }
      };

      if (btnRefresh) btnRefresh.addEventListener('click', loadOrders);

      if (adminLogoutBtn) {
        adminLogoutBtn.addEventListener('click', () => {
          localStorage.removeItem('buchisapa_admin_token');
          sessionStorage.removeItem('buchisapa_admin_session');
          window.location.href = '/login';
        });
      }

      loadOrders();
      setInterval(loadOrders, 10000); // Polling every 10 seconds for real-time order dashboard
    });
  </script>
</body>
</html>
