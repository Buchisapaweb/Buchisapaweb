<header class="admin-topbar">
  <div class="topbar-left">
    <button class="menu-toggle-btn" id="btn-mobile-menu" type="button" title="Abrir menú" aria-label="Abrir menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>

    <!-- WIDGET DE HORA Y FECHA EN TIEMPO REAL -->
    <div class="topbar-live-clock" id="topbar-live-clock" title="Hora y fecha oficial del sistema en vivo">
      <div class="live-clock-badge">
        <span class="live-clock-pulse"></span>
        <span class="live-clock-status">SISTEMA EN VIVO</span>
      </div>
      <div class="live-clock-content">
        <span class="live-clock-time" id="topbar-live-time">--:--:--</span>
        <span class="live-clock-sep">•</span>
        <span class="live-clock-date" id="topbar-live-date">--</span>
      </div>
    </div>
  </div>
  
  <div class="topbar-right">
    <div class="admin-user-pill" id="topbar-user-pill" onclick="window.switchAdminView('configuracion')" title="Gestionar perfil de administrador">
      <span class="user-name" id="topbar-user-name">Administrador</span>
      <div class="user-avatar-wrap">
        <img src="/imagenes/logo/logo-buchisapa.webp" alt="Administrador" class="user-avatar-img" id="topbar-user-avatar">
      </div>
    </div>
  </div>
</header>
