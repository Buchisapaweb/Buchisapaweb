<div class="main-page-card">
  <div class="view-header">
    <div class="view-header-title-wrap">
      <h2 class="view-title">Configuración General del Sistema</h2>
      <p class="view-subtitle">Parámetros generales de BuchiSapa Burger & Broaster, datos de contacto y horarios.</p>
    </div>
  </div>

  <div class="config-grid">
    <div class="config-card">
      <h3 class="card-section-title">Datos del Establecimiento</h3>
      <div class="form-group">
        <label class="form-label">Nombre del Restaurante</label>
        <input type="text" id="config-store-name" class="form-input" value="BuchiSapa Burger & Broaster">
      </div>
      <div class="form-group">
        <label class="form-label">Teléfono / WhatsApp Pedidos</label>
        <input type="text" id="config-store-phone" class="form-input" value="+51 987 654 321">
      </div>
      <div class="form-group">
        <label class="form-label">Horario de Atención</label>
        <input type="text" id="config-store-schedule" class="form-input" value="Lunes a Domingo: 5:00 PM - 11:30 PM">
      </div>
      <button class="btn btn-primary" id="btn-save-store-config">Guardar Cambios</button>
    </div>
  </div>
</div>
