<!-- DASHBOARD PRINCIPAL - BUCHISAPA -->
<div class="dashboard-container">

  <!-- 1. HERO BANNER DE BIENVENIDA -->
  <div class="dash-hero-card">
    <div class="dash-hero-content">
      <div class="dash-hero-greeting">
        <span class="greeting-wave">👋</span>
        <span class="greeting-text">¡Hola,</span>
      </div>
      <h1 class="dash-hero-title">Administrador!</h1>
      <p class="dash-hero-subtitle">Aquí tienes un resumen general de tu restaurante.</p>
      <div class="dash-hero-accent-bar"></div>
    </div>
    <div class="dash-hero-image-wrap">
      <img src="/imagenes/portada/Portada1E.webp" alt="Burger Administrador" class="dash-hero-img">
    </div>
  </div>

  <!-- 2. GRID DE 6 TARJETAS DE MÉTRICAS (2 COLUMNAS) -->
  <div class="dash-kpi-grid">

    <!-- TARJETA 1: CLIENTES -->
    <div class="dash-kpi-card kpi-card-yellow" data-target-view="clientes">
      <div class="kpi-card-left">
        <div class="kpi-icon-badge bg-yellow">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="kpi-card-details">
          <span class="kpi-card-title">Clientes</span>
          <span class="kpi-card-value" id="kpi-val-clientes">0</span>
        </div>
      </div>
      <div class="kpi-glow-accent glow-yellow"></div>
    </div>

    <!-- TARJETA 2: PRODUCTOS -->
    <div class="dash-kpi-card kpi-card-emerald" data-target-view="productos">
      <div class="kpi-card-left">
        <div class="kpi-icon-badge bg-emerald">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7.5 4.27 9 5.15"/>
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
            <path d="m3.3 7 8.7 5 8.7-5"/>
            <path d="M12 22V12"/>
          </svg>
        </div>
        <div class="kpi-card-details">
          <span class="kpi-card-title">Productos</span>
          <span class="kpi-card-value" id="kpi-val-productos">0</span>
        </div>
      </div>
      <div class="kpi-glow-accent glow-emerald"></div>
    </div>

    <!-- TARJETA 3: PEDIDOS -->
    <div class="dash-kpi-card kpi-card-blue" data-target-view="pedidos">
      <div class="kpi-card-left">
        <div class="kpi-icon-badge bg-blue">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <div class="kpi-card-details">
          <span class="kpi-card-title">Pedidos</span>
          <span class="kpi-card-value" id="kpi-val-pedidos">0</span>
        </div>
      </div>
      <div class="kpi-glow-accent glow-blue"></div>
    </div>

    <!-- TARJETA 4: CATEGORÍAS -->
    <div class="dash-kpi-card kpi-card-purple" data-target-view="categorias">
      <div class="kpi-card-left">
        <div class="kpi-icon-badge bg-purple">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="7" x="3" y="3" rx="1.5"/>
            <rect width="7" height="7" x="14" y="3" rx="1.5"/>
            <rect width="7" height="7" x="14" y="14" rx="1.5"/>
            <rect width="7" height="7" x="3" y="14" rx="1.5"/>
          </svg>
        </div>
        <div class="kpi-card-details">
          <span class="kpi-card-title">Categorías</span>
          <span class="kpi-card-value" id="kpi-val-categorias">0</span>
        </div>
      </div>
      <div class="kpi-glow-accent glow-purple"></div>
    </div>

    <!-- TARJETA 5: VENTAS -->
    <div class="dash-kpi-card kpi-card-amber" data-target-view="pedidos">
      <div class="kpi-card-left">
        <div class="kpi-icon-badge bg-amber">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div class="kpi-card-details">
          <span class="kpi-card-title">Ventas</span>
          <span class="kpi-card-value" id="kpi-val-ventas">0</span>
        </div>
      </div>
      <div class="kpi-glow-accent glow-amber"></div>
    </div>

    <!-- TARJETA 6: TICKETS -->
    <div class="dash-kpi-card kpi-card-cyan" data-target-view="ticket">
      <div class="kpi-card-left">
        <div class="kpi-icon-badge bg-cyan">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
            <path d="M13 5v2"/>
            <path d="M13 11v2"/>
            <path d="M13 17v2"/>
          </svg>
        </div>
        <div class="kpi-card-details">
          <span class="kpi-card-title">Tickets</span>
          <span class="kpi-card-value" id="kpi-val-ticket">0</span>
        </div>
      </div>
      <div class="kpi-glow-accent glow-cyan"></div>
    </div>

  </div>

  <!-- 3. SECCIÓN DE GRÁFICOS DE VENTAS -->
  <div class="dash-charts-grid">

    <!-- GRÁFICO 1: VENTAS DEL DÍA -->
    <div class="dash-chart-card">
      <div class="chart-card-header">
        <div class="chart-header-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span class="chart-title">Ventas del día</span>
        </div>
        <div class="chart-header-right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span class="chart-date-text" id="dash-chart-day-date">05 Oct. 2026</span>
        </div>
      </div>

      <div class="chart-canvas-container">
        <div class="custom-chart-wrap">
          <div class="chart-y-axis">
            <span>2.5K</span>
            <span>2K</span>
            <span>1.5K</span>
            <span>1K</span>
            <span>500</span>
            <span>0</span>
          </div>
          <div class="chart-plot-area">
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line line-zero"></div>

            <svg class="chart-line-svg" viewBox="0 0 300 120" preserveAspectRatio="none">
              <path d="M 10 110 L 50 110 L 90 110 L 130 110 L 170 110 L 210 110 L 250 110 L 290 110" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
              <circle cx="10" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="50" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="90" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="130" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="170" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="210" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="250" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="290" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div class="chart-x-axis">
          <span>8am</span>
          <span>10am</span>
          <span>12pm</span>
          <span>2pm</span>
          <span>4pm</span>
          <span>6pm</span>
          <span>8pm</span>
        </div>
      </div>
    </div>

    <!-- GRÁFICO 2: VENTAS POR LA SEMANA -->
    <div class="dash-chart-card">
      <div class="chart-card-header">
        <div class="chart-header-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span class="chart-title">Ventas por la semana</span>
        </div>
        <div class="chart-header-right">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
      </div>

      <div class="chart-canvas-container">
        <div class="custom-chart-wrap">
          <div class="chart-y-axis">
            <span>4K</span>
            <span>3K</span>
            <span>2K</span>
            <span>1K</span>
            <span>0</span>
          </div>
          <div class="chart-plot-area">
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line line-zero"></div>

            <svg class="chart-line-svg" viewBox="0 0 300 120" preserveAspectRatio="none">
              <path d="M 15 110 L 55 110 L 100 110 L 145 110 L 190 110 L 235 110 L 280 110" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
              <circle cx="15" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="55" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="100" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="145" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="190" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="235" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
              <circle cx="280" cy="110" r="4" fill="#f59e0b" stroke="#0a101d" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div class="chart-x-axis">
          <span>Lun</span>
          <span>Mar</span>
          <span>Mié</span>
          <span>Jue</span>
          <span>Vie</span>
          <span>Sáb</span>
          <span>Dom</span>
        </div>
      </div>
    </div>

  </div>

</div>
