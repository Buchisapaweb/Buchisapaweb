<div class="view-header">
  <div>
    <span class="view-kicker">CATÁLOGO VIRTUAL</span>
    <h2 class="view-title">Gestión de Productos y Platos</h2>
    <p class="view-subtitle">Agrega, edita y administra los platillos, precios, stock e imágenes de la carta.</p>
  </div>
  <div class="view-actions">
    <button class="btn btn-primary" onclick="window.openNewProductModal()">
      <span>+ Nuevo Producto</span>
    </button>
  </div>
</div>

<div class="dash-recent-orders-card">
  <div class="table-responsive">
    <table class="admin-table">
      <thead>
        <tr>
          <th>IMAGEN</th>
          <th>NOMBRE DEL PLATILLO</th>
          <th>CATEGORÍA</th>
          <th>PRECIO</th>
          <th>STOCK</th>
          <th>ESTADO</th>
          <th>ACCIONES</th>
        </tr>
      </thead>
      <tbody id="products-page-tbody">
        <tr>
          <td colspan="7" class="text-center py-4">Cargando productos del catálogo...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
