<div class="main-page-card">

      <h2 class="view-title">Catálogo de Productos y Platillos</h2>
      <p class="view-subtitle">Administra el menú oficial de BuchiSapa, precios, imágenes y disponibilidad.</p>

    <div class="view-actions">
      <button class="btn btn-primary" id="btn-open-new-product">
        <span>+ Nuevo Producto</span>

  <div class="table-responsive">

          <th>Stock / Disp.</th>
          <th>Estado</th>
          <th>Acciones</th>

        </tr>
      </tbody>
