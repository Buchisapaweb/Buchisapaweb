<!-- MENÚ LATERAL MOBILE (NAV DRAWER - DISEÑO EXACTO BUCHISAPA) -->
<div class="mobile-menu-backdrop" id="mobile-menu-backdrop" style="display: none;" onclick="toggleMobileMenu()">
  <div class="mobile-menu-drawer" onclick="event.stopPropagation()">
    
    <!-- CABECERA DEL MENÚ -->
    <div class="mobile-menu-header">
      <div class="mobile-menu-brand">
        <img src="/imagenes/logo/logo-buchisapa.png" alt="BuchiSapa Logo" class="mobile-drawer-logo">
        <span class="mobile-drawer-brand-title">BUCHISAPA BURGER</span>
      </div>
      <button class="mobile-drawer-close-btn" onclick="toggleMobileMenu()" aria-label="Cerrar menú">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <!-- CUERPO CON SCROLL DEL MENÚ -->
    <div class="mobile-drawer-body">

      <!-- LISTA DE OPCIONES EN TARJETAS BLANCAS -->
      <div class="mobile-nav-cards-list">
        
        <!-- BOTÓN PANEL ADMINISTRACIÓN (VISIBLE SI ES ADMIN) -->
        <a href="/admin" class="mobile-nav-card" id="drawer-admin-panel-btn" style="display: none; background: #0f172a; border: 1.5px solid #ff007f; text-decoration: none;">
          <div class="nav-card-left">
            <svg class="nav-card-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff007f" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
            <span class="nav-card-text" style="color: #ff66b2; font-weight: 800;">PANEL ADMIN</span>
          </div>
          <span style="background: #ff007f; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 12px;">ADMIN</span>
        </a>

        <!-- 1. PROMOCIONES -->
        <button class="mobile-nav-card" type="button" onclick="goToPromociones()">
          <div class="nav-card-left">
            <svg class="nav-card-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span class="nav-card-text">PROMOCIONES</span>
          </div>
        </button>

        <!-- 2. CATEGORÍAS (COLLAPSIBLE) -->
        <div class="mobile-nav-collapsible" id="categories-collapsible">
          <button class="mobile-nav-card" type="button" onclick="toggleNavCollapsible('categories-collapsible')">
            <div class="nav-card-left">
              <svg class="nav-card-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
              <span class="nav-card-text">CATEGORÍAS</span>
            </div>
            <svg class="nav-card-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="nav-collapsible-content">
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('platos-amazonicos', 'PLATOS AMAZÓNICOS')" class="sub-nav-link">PLATOS AMAZÓNICOS</a>
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('hamburguesas', 'HAMBURGUESAS')" class="sub-nav-link">HAMBURGUESAS</a>
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('broaster', 'BROASTER')" class="sub-nav-link">BROASTER</a>
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('salchipapas', 'SALCHIPAPAS Y SALCHIBROASTERS')" class="sub-nav-link">SALCHIPAPAS Y SALCHIBROASTERS</a>
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('alitas', 'ALITAS')" class="sub-nav-link">ALITAS</a>
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('bebidas', 'BEBIDAS')" class="sub-nav-link">BEBIDAS</a>
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('refrescos', 'REFRESCOS')" class="sub-nav-link">REFRESCOS</a>
            <a href="javascript:void(0)" onclick="selectCategoryFromDrawer('infusiones', 'INFUSIONES')" class="sub-nav-link">INFUSIONES</a>
          </div>
        </div>

        <!-- 3. MI PEDIDO ACTUAL -->
        <button class="mobile-nav-card" type="button" onclick="openCartFromDrawer()">
          <div class="nav-card-left">
            <svg class="nav-card-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="nav-card-text">MI PEDIDO ACTUAL</span>
          </div>
          <span class="drawer-cart-count" id="drawer-cart-count">0</span>
        </button>

        <!-- 4. CARTA SALÓN (COLLAPSIBLE) -->
        <div class="mobile-nav-collapsible" id="carta-salon-collapsible">
          <button class="mobile-nav-card" type="button" onclick="toggleNavCollapsible('carta-salon-collapsible')">
            <div class="nav-card-left">
              <svg class="nav-card-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span class="nav-card-text">CARTA SALÓN</span>
            </div>
            <svg class="nav-card-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="nav-collapsible-content">
            <a href="javascript:void(0)" onclick="openFullMenuModal()" class="sub-nav-link" style="font-weight: 700; color: #1e293b;">SANTA CLARA - ATE</a>
          </div>
        </div>

        <!-- 5. RASTREAR PEDIDO EN VIVO -->
        <button class="mobile-nav-card" type="button" onclick="closeMobileDrawer(); openOrderTracker();">
          <div class="nav-card-left">
            <svg class="nav-card-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
            <span class="nav-card-text">RASTREAR PEDIDO</span>
          </div>
          <span style="background: #fee2e2; color: #dc2626; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 20px;">EN VIVO</span>
        </button>


      </div>

      <!-- BOTONES DE ACCIÓN PRINCIPALES -->
      <div class="mobile-drawer-actions">
        
        <!-- CARD DE USUARIO CONECTADO -->
        <div class="drawer-user-card" id="drawer-user-card" style="display: none;" onclick="openUserProfileModal()">
          <div class="drawer-user-card-left">
            <div class="drawer-user-avatar" id="drawer-user-avatar">B</div>
            <div class="drawer-user-info">
              <span class="drawer-user-sub">SESIÓN INICIADA</span>
              <div class="drawer-user-greeting" id="drawer-user-greeting">Hola, Cliente</div>
            </div>
          </div>
          <button type="button" class="drawer-user-ver-perfil-btn" onclick="event.stopPropagation(); openUserProfileModal()">
            <span>Ver perfil</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <!-- BOTÓN ROJO INGRESAR -->
        <button class="drawer-btn-red" id="drawer-login-btn" type="button" onclick="handleUserIconClick()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="drawer-login-label">INGRESAR</span>
        </button>

        <!-- BOTÓN VERDE CLARO CONTACTAR POR WHATSAPP -->
        <a href="https://wa.me/51942475459?text=Hola%20Buchisapa,%20deseo%20realizar%20una%20consulta" target="_blank" rel="noopener noreferrer" class="drawer-btn-whatsapp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Contactar por WhatsApp</span>
        </a>

      </div>

    </div>

    <!-- SLOGAN FOOTER FIJO EN LA PARTE INFERIOR DEL MENÚ DESPLEGABLE -->
    <div class="mobile-drawer-footer">
      <p class="drawer-slogan">SABOR QUE SE LLENA</p>
    </div>

  </div>
</div>
