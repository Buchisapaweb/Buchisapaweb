<!-- HERO SLIDER / CAROUSEL BANNERS (CARGA DIRECTA E INSTANTÁNEA) -->
<section class="hero-carousel-container" aria-label="Banners de Portada BuchiSapa">
  <div class="carousel-track" id="hero-carousel-track">
    
    <!-- SLIDE 1: BROASTER -->
    <div class="carousel-slide active" style="background-image: url('/imagenes/portada/portada-1.jpg');">
      <img src="/imagenes/portada/portada-1.jpg" alt="Portada Pollo Broaster BuchiSapa" class="carousel-slide-img" loading="eager" decoding="async">
    </div>

    <!-- SLIDE 2: PLATOS AMAZÓNICOS -->
    <div class="carousel-slide" style="background-image: url('/imagenes/portada/portada-2.jpg');">
      <img src="/imagenes/portada/portada-2.jpg" alt="Portada Platos Amazónicos BuchiSapa" class="carousel-slide-img" loading="lazy" decoding="async">
    </div>

    <!-- SLIDE 3: HAMBURGUESAS -->
    <div class="carousel-slide" style="background-image: url('/imagenes/portada/portada-3.jpg');">
      <img src="/imagenes/portada/portada-3.jpg" alt="Portada Hamburguesas BuchiSapa" class="carousel-slide-img" loading="lazy" decoding="async">
    </div>

    <!-- SLIDE 4: HAMBURGUESA AMAZÓNICA -->
    <div class="carousel-slide" style="background-image: url('/imagenes/portada/portada-4.jpg');">
      <img src="/imagenes/portada/portada-4.jpg" alt="Portada Hamburguesa Amazónica BuchiSapa" class="carousel-slide-img" loading="lazy" decoding="async">
    </div>

  </div>

  <!-- INDICADORES PUNTOS -->
  <div class="carousel-dots" id="carousel-dots-container">
    <span class="carousel-dot active" onclick="goToSlide(0)" aria-label="Ir a diapositiva 1"></span>
    <span class="carousel-dot" onclick="goToSlide(1)" aria-label="Ir a diapositiva 2"></span>
    <span class="carousel-dot" onclick="goToSlide(2)" aria-label="Ir a diapositiva 3"></span>
    <span class="carousel-dot" onclick="goToSlide(3)" aria-label="Ir a diapositiva 4"></span>
  </div>
</section>
