<!-- HERO SLIDER / CAROUSEL BANNERS (CARGA WEBP Y LAZY LOADING INTELIGENTE) -->
<section class="hero-carousel-container" aria-label="Banners de Portada BuchiSapa">
  <div class="carousel-track" id="hero-carousel-track">
    
    <!-- SLIDE 1: BROASTER (EAGER LOAD WEBP) -->
    <div class="carousel-slide active" style="background-image: url('/imagenes/portada/Portada1E.webp');">
      <picture class="carousel-slide-picture">
        <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada1M.webp">
        <source media="(min-width: 641px)" srcset="/imagenes/portada/Portada1E.webp">
        <img src="/imagenes/portada/Portada1E.webp" alt="Portada Pollo Broaster BuchiSapa" class="carousel-slide-img" loading="eager" fetchpriority="high" decoding="async">
      </picture>
    </div>

    <!-- SLIDE 2: PLATOS AMAZÓNICOS (LAZY LOAD WEBP) -->
    <div class="carousel-slide lazy-bg" data-bg="url('/imagenes/portada/Portada2E.webp')">
      <picture class="carousel-slide-picture">
        <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada2M.webp">
        <source media="(min-width: 641px)" srcset="/imagenes/portada/Portada2E.webp">
        <img src="/imagenes/portada/Portada2E.webp" alt="Portada Platos Amazónicos BuchiSapa" class="carousel-slide-img lazy-img" loading="lazy" decoding="async">
      </picture>
    </div>

    <!-- SLIDE 3: HAMBURGUESAS (LAZY LOAD WEBP) -->
    <div class="carousel-slide lazy-bg" data-bg="url('/imagenes/portada/Portada3E.webp')">
      <picture class="carousel-slide-picture">
        <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada3M.webp">
        <source media="(min-width: 641px)" srcset="/imagenes/portada/Portada3E.webp">
        <img src="/imagenes/portada/Portada3E.webp" alt="Portada Hamburguesas BuchiSapa" class="carousel-slide-img lazy-img" loading="lazy" decoding="async">
      </picture>
    </div>

    <!-- SLIDE 4: HAMBURGUESA AMAZÓNICA (LAZY LOAD WEBP) -->
    <div class="carousel-slide lazy-bg" data-bg="url('/imagenes/portada/Portada4E.webp')">
      <picture class="carousel-slide-picture">
        <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada4M.webp">
        <source media="(min-width: 641px)" srcset="/imagenes/portada/Portada4E.webp">
        <img src="/imagenes/portada/Portada4E.webp" alt="Portada Hamburguesa Amazónica BuchiSapa" class="carousel-slide-img lazy-img" loading="lazy" decoding="async">
      </picture>
    </div>

    <!-- SLIDE 5: BURGER & COMBOS BUCHISAPA (WEBP) -->
    <div class="carousel-slide lazy-bg" data-bg="url('/imagenes/portada/Portada5E.webp')">
      <picture class="carousel-slide-picture">
        <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada5M.webp">
        <source media="(min-width: 641px)" srcset="/imagenes/portada/Portada5E.webp">
        <img src="/imagenes/portada/Portada5E.webp" alt="Portada Burger BuchiSapa" class="carousel-slide-img lazy-img" loading="lazy" decoding="async">
      </picture>
    </div>

  </div>

  <!-- INDICADORES PUNTOS -->
  <div class="carousel-dots" id="carousel-dots-container">
    <span class="carousel-dot active" onclick="goToSlide(0)" aria-label="Ir a diapositiva 1"></span>
    <span class="carousel-dot" onclick="goToSlide(1)" aria-label="Ir a diapositiva 2"></span>
    <span class="carousel-dot" onclick="goToSlide(2)" aria-label="Ir a diapositiva 3"></span>
    <span class="carousel-dot" onclick="goToSlide(3)" aria-label="Ir a diapositiva 4"></span>
    <span class="carousel-dot" onclick="goToSlide(4)" aria-label="Ir a diapositiva 5"></span>
  </div>
</section>
