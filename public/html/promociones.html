<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promociones | BuchiSapa</title>
  <meta name="description" content="Descubre las mejores promociones y combos de pollo brasa, broaster y platos amazónicos en BuchiSapa.">
  <link rel="icon" type="image/png" href="/imagenes/logo/logo-buchisapa.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/comun.css">
  <link rel="stylesheet" href="/css/encabezado.css">
  <link rel="stylesheet" href="/css/promociones.css">
</head>
<body class="promociones-page-body">

  <main class="promociones-main-container">
    
    <!-- ENLACE SUPERIOR: ← Volver al inicio -->
    <div class="promo-top-nav-row">
      <a href="/" class="promo-back-arrow-link" title="Volver a la página principal">
        <svg class="promo-back-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Volver al inicio</span>
      </a>
    </div>

    <!-- TÍTULO DE SECCIÓN: PROMOCIONES -->
    <h1 class="promo-page-title">PROMOCIONES</h1>

    <!-- CUADRÍCULA DE 4 COLUMNAS -->
    <section id="promociones-cards-container" class="promo-grid-4col" aria-label="Catálogo de Promociones BuchiSapa">
      <!-- Generado dinámicamente por promociones.js -->
    </section>

  </main>

  <!-- MODAL DE DETALLE VER MÁS -->
  <div id="promo-detail-modal" class="promo-modal-backdrop" style="display: none;" onclick="closePromoModal()">
    <div class="promo-modal-box" onclick="event.stopPropagation()">
      <img id="promo-modal-image" src="" alt="Promoción BuchiSapa" class="promo-modal-img">
      <div class="promo-modal-content">
        <h2 id="promo-modal-title" class="promo-modal-title"></h2>
        <p id="promo-modal-description" class="promo-modal-full-desc"></p>
        <div class="promo-modal-actions">
          <span id="promo-modal-price" class="promo-item-price" style="font-size: 20px;"></span>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="promo-modal-close-btn" onclick="closePromoModal()">Cerrar</button>
            <button type="button" id="promo-modal-add-btn" class="promo-btn-agregar">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              <span>Agregar al pedido</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/promociones.js?v=20260928_1"></script>
</body>
</html>
