<div class="modal-backdrop customizer-backdrop" id="product-detail-modal" onclick="if(event.target === this) closeProductDetailModal()">
  <div class="customizer-modal-box" onclick="event.stopPropagation()">
    <div class="customizer-header">
      <button type="button" class="customizer-close-btn" onclick="closeProductDetailModal()" aria-label="Cerrar modal">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <div class="customizer-body" id="customizer-dynamic-content">
      <div class="customizer-image-wrap">
        <img id="customizer-product-img" src="/imagenes/logo/logo-buchisapa.webp" alt="Plato" class="customizer-img">
      </div>

      <div class="customizer-info-section">
        <h2 id="customizer-product-name" class="customizer-title">Nombre del Plato</h2>
        <p id="customizer-product-desc" class="customizer-desc">Descripción detallada del plato y sus ingredientes.</p>
        <span id="customizer-product-price" class="customizer-price">S/ 0.00</span>
      </div>

      <div class="customizer-options-section" id="customizer-sauces-group">
        <h3 class="customizer-options-title">Elige tus cremas y salsas</h3>
        <p class="customizer-options-subtitle">Selecciona las que desees para tu plato</p>
        <div class="sauces-grid" id="customizer-sauces-list"></div>
      </div>

      <div class="customizer-notes-section">
        <label for="customizer-notes-input" class="customizer-notes-label">Instrucciones especiales</label>
        <textarea id="customizer-notes-input" class="customizer-notes-textarea" placeholder="Ej: Sin cebolla, papas bien doradas, salsa aparte..."></textarea>
      </div>
    </div>

    <div class="customizer-footer">
      <div class="customizer-qty-control">
        <button type="button" class="qty-btn" onclick="customizerChangeQty(-1)" aria-label="Disminuir cantidad">-</button>
        <span id="customizer-qty-display" class="qty-number">1</span>
        <button type="button" class="qty-btn" onclick="customizerChangeQty(1)" aria-label="Aumentar cantidad">+</button>
      </div>

      <button type="button" id="customizer-add-cart-btn" class="customizer-submit-btn" onclick="customizerSubmitAddToCart()">
        <span>Agregar al Pedido</span>
        <span id="customizer-total-price">S/ 0.00</span>
      </button>
    </div>
  </div>
</div>
