<div class="cart-drawer-backdrop" id="cart-drawer-modal" onclick="BuchisapaCart.handleBackdropClick(event)">
  <div class="cart-drawer" onclick="event.stopPropagation()">
    <div class="cart-drawer-header">
      <div class="cart-drawer-brand">
        <img src="/imagenes/logo/logo-buchisapa.webp" alt="BuchiSapa Logo" class="cart-brand-logo">
        <span class="cart-brand-title">BUCHISAPA</span>
      </div>

      <button class="cart-nav-back-btn" type="button" onclick="BuchisapaCart.closeDrawer()" aria-label="Volver a la carta">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Volver</span>
      </button>
    </div>

    <div class="cart-drawer-body" id="cart-items-container"></div>
  </div>
</div>
