<!-- HEADER NAVEGACIÓN Y BÚSQUEDA OFICIAL BUCHISAPA -->
<script>
  if (typeof window.toggleMobileMenu !== 'function') {
    window.toggleMobileMenu = function(forceState) {
      var backdrop = document.getElementById('mobile-menu-backdrop');
      if (!backdrop) return;
      var isOpen = backdrop.classList.contains('active') || backdrop.classList.contains('open') || backdrop.style.display === 'flex';
      var shouldOpen = typeof forceState === 'boolean' ? forceState : !isOpen;
      if (shouldOpen) {
        backdrop.style.display = 'flex';
        void backdrop.offsetWidth;
        backdrop.classList.add('active', 'open');
        document.body.style.overflow = 'hidden';
        if (window.BuchisapaCart && typeof window.BuchisapaCart.getItemsCount === 'function') {
          var countEl = document.getElementById('drawer-cart-count');
          if (countEl) countEl.textContent = String(window.BuchisapaCart.getItemsCount());
        }
      } else {
        backdrop.classList.remove('active', 'open');
        setTimeout(function() {
          if (!backdrop.classList.contains('active') && !backdrop.classList.contains('open')) {
            backdrop.style.display = 'none';
          }
        }, 280);
        document.body.style.overflow = '';
      }
    };
    window.openMobileMenu = function() { window.toggleMobileMenu(true); };
    window.closeMobileDrawer = function() { window.toggleMobileMenu(false); };
    window.closeMobileMenu = function() { window.toggleMobileMenu(false); };
  }
</script>
<header class="site-header">
  <div class="container header-nav">
    
    <!-- LADO IZQUIERDO: TOGGLE MÓVIL Y LOGO -->
    <div class="header-left">
      <button class="nav-toggle-btn mobile-only" aria-label="Abrir menú" onclick="toggleMobileMenu()" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round">
          <line x1="3" x2="21" y1="6" y2="6"/>
          <line x1="3" x2="21" y1="12" y2="12"/>
          <line x1="3" x2="21" y1="18" y2="18"/>
        </svg>
      </button>
      
      <a href="/" class="brand-logo" title="BuchiSapa - Pollería & Sabor Amazónico">
        <img src="/imagenes/logo/logo-buchisapa.webp" alt="BuchiSapa Logo" class="brand-logo-img">
      </a>
    </div>

    <!-- SELECTOR DE UBICACIÓN (ESTILO PARDO'S / GOURMET) -->
    <div class="location-picker-inline" onclick="openLocationModal()" title="Cambiar dirección o modo de entrega">
      <svg class="location-pin-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
        <circle cx="12" cy="10" r="3.2"/>
      </svg>
      <span class="location-text-red" id="selected-location-label">Entregar a Santa Clara</span>
      <svg class="location-arrow-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>

    <!-- NAVEGACIÓN PRINCIPAL (ESCRITORIO, TABLETA Y PANTALLA GRANDE) -->
    <nav class="desktop-main-nav">
      <!-- 1. PROMOCIONES -->
      <button class="desktop-nav-link" type="button" onclick="goToPromociones()">
        <span>PROMOCIONES</span>
      </button>

      <!-- 2. CATEGORÍAS ⌵ -->
      <div class="desktop-dropdown-wrap" id="nav-dropdown-categorias">
        <button class="desktop-nav-link dropdown-trigger" type="button" aria-haspopup="true" aria-expanded="false">
          <span>CATEGORÍAS</span>
          <svg class="nav-chevron-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="desktop-dropdown-menu">
          <button class="dropdown-item" type="button" onclick="openCategoryView('alitas', 'ALITAS')">ALITAS</button>
          <button class="dropdown-item" type="button" onclick="openCategoryView('bebidas', 'BEBIDAS')">BEBIDAS</button>
          <button class="dropdown-item" type="button" onclick="openCategoryView('broaster', 'BROASTER')">BROASTER</button>
          <button class="dropdown-item" type="button" onclick="openCategoryView('hamburguesas', 'HAMBURGUESAS')">HAMBURGUESAS</button>
          <button class="dropdown-item" type="button" onclick="openCategoryView('infusiones', 'INFUSIONES')">INFUSIONES</button>
          <button class="dropdown-item" type="button" onclick="openCategoryView('platos-amazonicos', 'PLATOS AMAZÓNICOS')">PLATOS AMAZÓNICOS</button>
          <button class="dropdown-item" type="button" onclick="openCategoryView('refrescos', 'REFRESCOS')">REFRESCOS</button>
          <button class="dropdown-item" type="button" onclick="openCategoryView('salchipapas-y-salchibroasters', 'SALCHIPAPAS Y SALCHIBROASTERS')">SALCHIPAPAS Y SALCHIBROASTERS</button>
        </div>
      </div>

      <!-- 3. CARTA SALÓN ⌵ -->
      <div class="desktop-dropdown-wrap" id="nav-dropdown-carta">
        <button class="desktop-nav-link dropdown-trigger" type="button" aria-haspopup="true" aria-expanded="false">
          <span>CARTA SALÓN</span>
          <svg class="nav-chevron-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="desktop-dropdown-menu">
          <button class="dropdown-item" type="button" onclick="openFullMenuModal()">CARTA COMPLETA</button>
          <button class="dropdown-item" type="button" onclick="openOrderTracker()">RASTREAR MI PEDIDO</button>
          <a href="/nosotros" class="dropdown-item" style="text-decoration: none;">SOBRE BUCHISAPA</a>
        </div>
      </div>
    </nav>

    <!-- BARRA DE BÚSQUEDA INTEGRADA: [🔍 RED] ¿Qué se te antoja? -->
    <div class="desktop-search-pill-wrap">
      <div class="desktop-search-input-box">
        <svg class="search-box-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input 
          type="text" 
          id="desktop-search-input" 
          class="desktop-search-field" 
          placeholder="¿Qué se te antoja?" 
          oninput="onSearchInputChanged(this.value)"
          autocomplete="off"
        >
        <button id="desktop-search-clear-btn" class="search-clear-btn-inline" type="button" onclick="clearSearchInput()" aria-label="Limpiar búsqueda" style="display: none;">✕</button>
      </div>
    </div>

    <!-- ACCIONES DE CABECERA: MI PEDIDO & INGRESAR -->
    <div class="header-actions">
      <!-- BOTÓN BÚSQUEDA SOLO EN MÓVILES PEQUEÑOS -->
      <button class="header-icon-btn mobile-only" id="header-search-btn" aria-label="Buscar platos" onclick="toggleSearchBar()" title="Buscar platos" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7.5"/>
          <line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
      </button>

      <!-- BOTÓN MI PEDIDO ([🛍️ RED] MI PEDIDO) -->
      <button class="desktop-cart-link-btn" aria-label="Mi Pedido" onclick="BuchisapaCart.openDrawer()" type="button" title="Ver mi pedido">
        <svg class="cart-bag-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12l3 5v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8l3-5Z"/>
          <path d="M3 8h18"/>
          <path d="M16 11.5c0 2.2-1.79 4-4 4s-4-1.8-4-4"/>
        </svg>
        <span class="desktop-cart-text">MI PEDIDO</span>
        <span class="cart-count-badge" id="cart-count-badge" style="display: none;">0</span>
      </button>

      <!-- BOTÓN ROJO SÓLIDO INGRESAR ([👤 WHITE] INGRESAR) -->
      <button class="desktop-user-auth-btn" id="header-auth-btn" aria-label="Ingresar a mi cuenta" onclick="handleUserIconClick()" type="button">
        <svg class="auth-user-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="header-auth-btn-label">INGRESAR</span>
      </button>
    </div>

  </div>
</header>

<!-- BARRA DE BÚSQUEDA DESPLEGABLE EN DISPOSITIVOS MÓVILES -->
<div class="buchisapa-search-bar-wrap" id="buchisapa-search-bar-wrap" style="display: none;">
  <div class="container search-bar-inner">
    <div class="search-bar-top-row">
      <div class="search-input-pill-wrapper">
        <svg class="search-pill-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7.5"/>
          <line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <input 
          type="text" 
          id="main-search-input" 
          class="search-pill-input" 
          placeholder="¿Qué se te antoja?" 
          oninput="onSearchInputChanged(this.value)"
          autocomplete="off"
        >
        <button id="search-clear-btn" class="search-clear-btn" type="button" onclick="clearSearchInput()" aria-label="Limpiar búsqueda" style="display: none;">✕</button>
      </div>
      <button id="search-close-action-btn" class="search-action-btn" type="button" onclick="toggleSearchBar(false)">Cerrar</button>
    </div>
  </div>
</div>
