<!-- VENTANA / PÁGINA COMPLETA DE TU PEDIDO BUCHISAPA (SIN DESLIZAMIENTOS) -->
<div class="cart-drawer-backdrop" id="cart-drawer-modal" onclick="BuchisapaCart.handleBackdropClick(event)">
  <div class="cart-drawer" onclick="event.stopPropagation()">
    <!-- HEADER CON BOTÓN VOLVER, BADGE CENTRADO Y BOTÓN CERRAR -->
    <div class="cart-drawer-header">
      <button class="cart-nav-back-btn" type="button" onclick="BuchisapaCart.closeDrawer()" aria-label="Volver a la carta">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Volver</span>
      </button>

      <div class="cart-header-title-wrap">
        <div class="cart-header-icon-badge">
          <svg class="cart-header-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <h2 class="cart-header-title">Tu Pedido Buchisapa</h2>
      </div>

      <button class="cart-drawer-close-btn" type="button" onclick="BuchisapaCart.closeDrawer()" aria-label="Cerrar pedido">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- BARRA DE CONTEO Y BOTÓN VACIAR -->
    <div class="cart-subbar-wrap" id="cart-subbar-wrap" style="display: none;">
      <span class="cart-subbar-count" id="cart-subbar-count">PLATOS SELECCIONADOS (1)</span>
      <button class="cart-subbar-empty-btn" type="button" onclick="BuchisapaCart.clear()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
        <span>Vaciar</span>
      </button>
    </div>

    <!-- CONTENEDOR DINÁMICO DE ITEMS Y RESUMEN / ESTADO VACÍO -->
    <div class="cart-drawer-body" id="cart-items-container"></div>
  </div>
</div>
