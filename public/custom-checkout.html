<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      const createSafeMock = () => {
        const fn = function() {
          return safeMock;
        };
        const safeMock = new Proxy(fn, {
          get: (target, prop) => {
            if (prop === Symbol.toPrimitive) {
              return (hint) => hint === 'string' ? '[object Object]' : 0;
            }
            return safeMock;
          }
        });
        return safeMock;
      };
      const alMock = createSafeMock();
      try {
        Object.defineProperty(window, 'al', {
          get: () => alMock,
          set: (val) => {},
          configurable: true
        });
      } catch (e) {
        window.al = alMock;
      }
    })();
    window.onerror = function (msg) {
      if (!msg || msg.toString().toLowerCase().includes('script error') || msg.toString().toLowerCase().includes('pino')) {
        return true;
      }
      return false;
    };
    window.addEventListener('error', function (e) {
      const msg = (e && (e.message || (e.error && e.error.message))) || '';
      if (!msg || msg.toString().toLowerCase().includes('script error') || msg.toString().toLowerCase().includes('pino')) {
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        if (e.preventDefault) e.preventDefault();
        return true;
      }
    }, true);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Culqi 3DS Custom Checkout | BuchiSapa</title>
  <meta name="description" content="Pasarela de pago segura Culqi 3DS para BuchiSapa Burger & Broaster.">
  <link rel="icon" type="image/png" href="/imagenes/logo/logo-buchisapa.webp">

  <!-- Fuentes oficiales BuchiSapa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Scripts Oficiales de Culqi (Custom Checkout multipago v1.0 y 3DS) -->
  <script src="https://3ds.culqi.com"></script>
  <script src="https://js.culqi.com/checkout-js"></script>
  <script src="/culqi/culqi-payment.js"></script>

  <style>
    :root {
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --secondary: #16a34a;
      --bg: #0b1120;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b1120 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .culqi-custom-container {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(220, 38, 38, 0.15);
      text-align: center;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      box-shadow: 0 0 16px rgba(220, 38, 38, 0.4);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .brand-badge-secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(22, 163, 74, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-top: 6px;
    }

    .order-summary-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .summary-row.total {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 0;
    }

    .total-amount-display {
      font-size: 24px;
      font-weight: 900;
      color: #ef4444;
    }

    .customer-info-box {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 22px;
      text-align: left;
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .customer-info-box strong {
      color: #f1f5f9;
    }

    .btn-pay-culqi {
      width: 100%;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-pay-culqi:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(220, 38, 38, 0.5);
    }

    .btn-pay-culqi:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .payment-methods-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: #ffffff;
    }

    .status-alert {
      display: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .status-alert.success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #4ade80;
    }

    .status-alert.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <div class="culqi-custom-container">
    
    <div class="brand-header">
      <img src="/imagenes/logo/logo-buchisapa.webp" alt="BuchiSapa Logo" class="brand-logo">
      <h1 class="brand-title">BuchiSapa Checkout</h1>
      <span class="brand-badge-secure">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm-1 14.5l-3.5-3.5 1.41-1.41L11 13.67l5.09-5.09 1.41 1.41L11 16.5z"/></svg>
        Culqi 3DS Seguro & Encriptado
      </span>
    </div>

    <div id="payment-status-box" class="status-alert"></div>

    <div class="order-summary-box">
      <div class="summary-row">
        <span>Número de Orden:</span>
        <strong id="display-order-code">#---</strong>
      </div>
      <div class="summary-row">
        <span>Modalidad:</span>
        <strong id="display-order-type">Delivery / Recojo</strong>
      </div>
      <div class="summary-row total">
        <span>Total a Pagar (IGV inc.):</span>
        <span class="total-amount-display" id="display-order-total">S/ 0.00</span>
      </div>
    </div>

    <div class="customer-info-box">
      <div>Cliente: <strong id="display-cust-name">---</strong></div>
      <div>Teléfono: <strong id="display-cust-phone">---</strong></div>
      <div>Entrega: <strong id="display-cust-address">---</strong></div>
    </div>

    <button type="button" id="btn-start-culqi-payment" class="btn-pay-culqi" onclick="initiateCulqiPayment()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
      <span>Pagar con Culqi (Tarjeta / Yape)</span>
    </button>

    <div class="payment-methods-icons">
      <span>💳 Visa</span>
      <span>💳 Mastercard</span>
      <span>📱 Yape</span>
      <span>💳 AMEX / Diners</span>
    </div>

    <a href="/" class="back-link">← Cancelar y volver al restaurante</a>
  </div>

  <script>
    // CONFIGURACIÓN DE LLAVES Y PARÁMETROS CULQI 3DS
    let publicKey = 'pk_test_04c5e31a0e10b14b';
    let orderData = {
      amount: 0,
      orderNumber: 101,
      customerName: 'Cliente Buchisapa',
      customerPhone: '943312024',
      customerEmail: 'cliente@buchisapa.pe',
      deliveryAddress: 'Santa Clara, Ate',
      orderType: 'delivery',
      items: [],
      notes: ''
    };

    // 1. Obtener parámetros desde URL o localStorage
    function loadOrderFromContext() {
      const urlParams = new URLSearchParams(window.location.search);
      
      const paramAmount = parseFloat(urlParams.get('amount'));
      const paramOrder = urlParams.get('orderNumber') || urlParams.get('order');
      const paramName = urlParams.get('name') || urlParams.get('customerName');
      const paramPhone = urlParams.get('phone') || urlParams.get('customerPhone');
      const paramEmail = urlParams.get('email') || urlParams.get('customerEmail');
      const paramAddress = urlParams.get('address') || urlParams.get('deliveryAddress');
      const paramType = urlParams.get('type') || urlParams.get('orderType');

      if (!isNaN(paramAmount) && paramAmount > 0) {
        orderData.amount = paramAmount;
        if (paramOrder) orderData.orderNumber = paramOrder;
        if (paramName) orderData.customerName = paramName;
        if (paramPhone) orderData.customerPhone = paramPhone;
        if (paramEmail) orderData.customerEmail = paramEmail;
        if (paramAddress) orderData.deliveryAddress = paramAddress;
        if (paramType) orderData.orderType = paramType;
      } else {
        // Cargar desde localStorage
        try {
          const cart = JSON.parse(localStorage.getItem('buchisapa_cart') || '[]');
          const cust = JSON.parse(localStorage.getItem('buchisapa_customer') || '{}');
          const type = localStorage.getItem('buchisapa_order_type') || 'delivery';
          const phone = localStorage.getItem('buchisapa_delivery_phone') || '';
          
          let subtotal = 0;
          cart.forEach(it => {
            subtotal += (parseFloat(it.price) || 0) * (parseInt(it.quantity) || 1);
          });
          const fee = type === 'pickup' ? 0 : 4.00;
          orderData.amount = subtotal + fee;
          orderData.items = cart;
          orderData.orderType = type;
          if (cust.name) orderData.customerName = cust.name;
          if (cust.email) orderData.customerEmail = cust.email;
          if (phone) orderData.customerPhone = phone;
          orderData.orderNumber = Math.floor(100 + Math.random() * 900);
        } catch (e) {}
      }

      // Actualizar UI
      document.getElementById('display-order-code').textContent = `#${orderData.orderNumber}`;
      document.getElementById('display-order-type').textContent = orderData.orderType === 'pickup' ? '🏪 Recojo en Tienda' : '🛵 Delivery a Domicilio';
      document.getElementById('display-order-total').textContent = `S/ ${orderData.amount.toFixed(2)}`;
      document.getElementById('display-cust-name').textContent = orderData.customerName;
      document.getElementById('display-cust-phone').textContent = orderData.customerPhone;
      document.getElementById('display-cust-address').textContent = orderData.deliveryAddress;
    }

    // 2. Cargar configuración remota del servidor
    async function fetchServerCulqiConfig() {
      try {
        const res = await fetch('/api/payments/culqi/config');
        if (res.ok) {
          const cfg = await res.json();
          if (cfg && cfg.publicKey) {
            publicKey = cfg.publicKey;
          }
        }
      } catch (e) {}
    }

    // 3. Iniciar flujo de pago con Custom Culqi Checkout Multipago v1.0
    async function initiateCulqiPayment() {
      const btn = document.getElementById('btn-start-culqi-payment');
      btn.disabled = true;
      btn.innerHTML = `<span>Iniciando Pasarela Culqi Multipago...</span>`;

      if (window.BuchisapaCulqi && typeof window.BuchisapaCulqi.openCustomCheckout === 'function') {
        try {
          await window.BuchisapaCulqi.openCustomCheckout({
            amount: orderData.amount,
            orderNumber: orderData.orderNumber,
            customerEmail: orderData.customerEmail,
            customerName: orderData.customerName,
            orderPayload: {
              ...orderData,
              paymentMethod: 'Culqi Multipago Online'
            },
            menuType: 'sidebar',
            onSuccess: (result) => {
              const chargeId = result.chargeId || (result.order && result.order.id) || `chr_${Date.now()}`;
              showStatus(`✅ ¡Pago Exitoso! ID: ${chargeId}`, 'success');
              
              if (window.Android && window.Android.onPaymentSuccess) {
                window.Android.onPaymentSuccess(JSON.stringify(result));
              }

              localStorage.removeItem('buchisapa_cart');

              try {
                window.open(`https://wa.me/51943312024?text=${waMsg}`, '_blank');
              } catch (e) {}

              setTimeout(() => {
                window.location.href = `/?order_success=${orderData.orderNumber}`;
              }, 1200);
            },
            onError: (err) => {
              const errMsg = err.message || 'El pago fue declinado por tu entidad bancaria.';
              showStatus(`⚠️ ${errMsg}`, 'error');
              if (window.Android && window.Android.onPaymentError) {
                window.Android.onPaymentError(errMsg);
              }
              btn.disabled = false;
              btn.innerHTML = `<span>Reintentar Pago con Culqi</span>`;
            }
          });
          return;
        } catch (err) {
          console.warn('Fallback al método alternativo:', err);
        }
      }

      await fetchServerCulqiConfig();

      if (!window.Culqi) {
        showStatus('No se pudo cargar la librería Culqi. Verifica tu conexión.', 'error');
        btn.disabled = false;
        btn.innerHTML = `<span>Reintentar Pago</span>`;
        return;
      }

      const amountInCents = Math.round(orderData.amount * 100);

      // Configuración Culqi v4
      window.Culqi.publicKey = publicKey;
      window.Culqi.settings({
        title: 'BuchiSapa - Pollería & Parrillas',
        currency: 'PEN',
        amount: amountInCents
      });

      window.Culqi.options({
        lang: 'es',
        modal: true,
        installments: true,
        paymentMethods: {
          tarjeta: true,
          yape: true,
          billetera: true,
          bancaMovil: true,
          agente: true,
          cuotealo: false
        }
      });

      // Handler global de respuesta de Culqi
      window.culqi = async function() {
        if (window.Culqi.token) {
          const token = window.Culqi.token.id;
          const email = window.Culqi.token.email || orderData.customerEmail || 'cliente@buchisapa.pe';
          
          if (window.Culqi.close) window.Culqi.close();
          showStatus('Procesando pago seguro con el banco...', 'success');

          try {
            const res = await fetch('/api/payments/culqi/charge', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token: token,
                email: email,
                amount: orderData.amount,
                orderPayload: {
                  ...orderData,
                  paymentMethod: 'Culqi 3DS Online'
                }
              })
            });

            const result = await res.json();

            if (res.ok && result.success) {
              const chargeId = result.chargeId || `chr_${Date.now()}`;
              showStatus(`✅ ¡Pago Exitoso! ID: ${chargeId}`, 'success');
              
              // Notificar a Android si corre en WebView
              if (window.Android && window.Android.onPaymentSuccess) {
                window.Android.onPaymentSuccess(JSON.stringify(result));
              }

              // Limpiar carrito local
              localStorage.removeItem('buchisapa_cart');

              // Abrir WhatsApp en pestaña separada si es compatible y volver a index.html
              try {
                window.open(`https://wa.me/51943312024?text=${waMsg}`, '_blank');
              } catch (e) {}

              setTimeout(() => {
                window.location.href = `/?order_success=${orderData.orderNumber}`;
              }, 1200);

            } else {
              const errMsg = result.error || 'El pago fue declinado por tu entidad bancaria.';
              showStatus(`⚠️ ${errMsg}`, 'error');
              if (window.Android && window.Android.onPaymentError) {
                window.Android.onPaymentError(errMsg);
              }
              btn.disabled = false;
              btn.innerHTML = `<span>Reintentar Pago con Culqi</span>`;
            }

          } catch (netErr) {
            showStatus('Error de conexión con el servidor al registrar el cobro.', 'error');
            btn.disabled = false;
            btn.innerHTML = `<span>Reintentar Pago</span>`;
          }

        } else if (window.Culqi.order) {
          if (window.Culqi.close) window.Culqi.close();
          showStatus('Orden de pago generada. Redirigiendo...', 'success');
        } else if (window.Culqi.error) {
          const userErr = window.Culqi.error.user_message || 'El pago no se pudo completar.';
          showStatus(`⚠️ ${userErr}`, 'error');
          if (window.Android && window.Android.onPaymentError) {
            window.Android.onPaymentError(userErr);
          }
          btn.disabled = false;
          btn.innerHTML = `<span>Reintentar Pago con Culqi</span>`;
        }
      };

      window.Culqi.open();
    }

    function showStatus(text, type) {
      const box = document.getElementById('payment-status-box');
      box.textContent = text;
      box.className = `status-alert ${type}`;
      box.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOrderFromContext();
      fetchServerCulqiConfig();
    });
  </script>
</body>
</html>
