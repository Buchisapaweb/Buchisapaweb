<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar - BuchiSapa</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="cabecera">

        <button class="btn-cerrar" type="button" id="btnCerrar" onclick="window.location.href='/'">
            ×
        </button>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="login-container">

        <!-- LOGO -->
        <img
            src="/imagenes/logo/logo-buchisapa.webp"
            alt="BuchiSapa"
            class="logo"
        >


        <!-- TÍTULO -->
        <h1>
            ¡Bienvenido a Buchisapa!
        </h1>


        <!-- FORMULARIO -->
        <form id="loginForm">


            <!-- CORREO -->
            <div class="campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="tu@email.com"
                    autocomplete="email"
                >

            </div>


            <!-- CONTRASEÑA -->
            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="btn-ojo"
                        id="btnOjo"
                        aria-label="Mostrar contraseña"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- RECUPERAR -->
            <div class="recuperar-container">

                <a href="#" class="recuperar" id="linkRecuperar">
                    Recuperar contraseña
                </a>

            </div>


            <!-- INGRESAR -->
            <button
                type="submit"
                class="btn-ingresar"
                id="btnIngresar"
                disabled
            >
                Ingresar
            </button>

        </form>


        <!-- INVITADO -->
        <button
            type="button"
            class="btn-invitado"
            id="btnInvitado"
            onclick="window.location.href='/'"
        >

            <span class="icono-usuario">
                ♙
            </span>

            <span>
                Continuar como invitado
            </span>

        </button>


        <!-- REGISTRO -->
        <p class="registro">

            ¿No tienes una cuenta?

            <a href="#" id="linkRegistro">
                Regístrate aquí
            </a>

        </p>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
