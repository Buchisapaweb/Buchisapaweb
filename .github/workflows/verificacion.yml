name: Verificación de BuchiSapa

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm install
      - name: Verificar TypeScript
        run: npm run verificar
      - name: Construir y validar recursos
        run: npm run build
