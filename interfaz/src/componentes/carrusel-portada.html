<!-- Carrusel de Foto de Portada Oficial BuchiSapa -->
<section id="seccion-portada" class="seccion-portada">
  <div class="contenedor-portada">
    <div class="carrusel-marco">
      <!-- Diapositivas de portada -->
      <div class="diapositiva activa" data-indice="0">
        <picture>
          <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada1M.webp" type="image/webp">
          <img src="/imagenes/portada/Portada1E.webp" alt="Pollo a la Brasa BuchiSapa" class="imagen-portada" />
        </picture>
      </div>
      <div class="diapositiva" data-indice="1">
        <picture>
          <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada2M.webp" type="image/webp">
          <img src="/imagenes/portada/Portada2E.webp" alt="Sabor Amazónico y Tradición" class="imagen-portada" />
        </picture>
      </div>
      <div class="diapositiva" data-indice="2">
        <picture>
          <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada3M.webp" type="image/webp">
          <img src="/imagenes/portada/Portada3E.webp" alt="Broaster Crujiente y Alitas" class="imagen-portada" />
        </picture>
      </div>
      <div class="diapositiva" data-indice="3">
        <picture>
          <source media="(max-width: 640px)" srcset="/imagenes/portada/Portada4M.webp" type="image/webp">
          <img src="/imagenes/portada/Portada4E.webp" alt="Hamburguesas y Promociones Nocturnas" class="imagen-portada" />
        </picture>
      </div>

      <!-- Indicadores de diapositiva -->
      <div class="indicadores-portada">
        <button class="indicador activo" data-slide="0" aria-label="Portada 1"></button>
        <button class="indicador" data-slide="1" aria-label="Portada 2"></button>
        <button class="indicador" data-slide="2" aria-label="Portada 3"></button>
        <button class="indicador" data-slide="3" aria-label="Portada 4"></button>
      </div>
    </div>
  </div>
</section>
