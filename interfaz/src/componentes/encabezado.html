<!-- Encabezado Oficial BuchiSapa - Diseño Blanco Limpio -->
<header id="encabezado-principal" class="encabezado">
  <div class="contenedor-encabezado">
    <div class="lado-izquierdo">
      <button id="btn-menu-hamburguesa" class="btn-icono" aria-label="Abrir menú">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="/" class="logo-link" aria-label="Ir al inicio">
        <img src="/imagenes/logo/logo-buchisapa.webp" alt="Logo BuchiSapa" class="logo-imagen" />
      </a>
    </div>

    <div class="centro-ubicacion">
      <button id="btn-selector-ubicacion" class="btn-ubicacion">
        <svg class="icono-pin" viewBox="0 0 24 24" fill="#dc2626" stroke="#dc2626">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3" fill="#ffffff"></circle>
        </svg>
        <span id="texto-ubicacion">Entrega en Santa Clara</span>
        <svg class="icono-flecha" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="3">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <div class="lado-derecho">
      <button id="btn-abrir-busqueda" class="btn-icono" aria-label="Buscar">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button id="btn-abrir-carrito" class="btn-carrito" aria-label="Ver pedido">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span id="contador-carrito" class="insignia-carrito">0</span>
      </button>
    </div>
  </div>
</header>
